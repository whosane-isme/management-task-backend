[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "management-task-backend"
version = "0.1.0"
description = "Secure task management backend for small teams"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "alembic>=1.18,<2",
    "authlib>=1.7,<2",
    "fastapi[standard-no-fastapi-cloud-cli]>=0.136,<0.137",
    "itsdangerous>=2.2,<3",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.10,<3",
    "sqlalchemy[asyncio]>=2.0.51,<2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4,<10",
    "pytest-asyncio>=1.2,<2",
    "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = [
    "integration: requires a migrated PostgreSQL test database",
]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "FAST"]
ignore = ["S101"]

[tool.ruff.format]
quote-style = "double"
